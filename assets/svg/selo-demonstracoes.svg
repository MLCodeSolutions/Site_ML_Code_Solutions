<svg xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true" viewBox="0 0 64 64"><style>.halo { animation: halo 3.6s ease-in-out infinite; transform-origin: 32px 32px; }
    .check { stroke-dasharray: 16; stroke-dashoffset: 0; animation: draw 4.8s ease-in-out infinite; }
    @keyframes halo { 0%, 100% { opacity: .35; transform: scale(.92); } 50% { opacity: .7; transform: scale(1.04); } }
    @keyframes draw { 0%, 70% { stroke-dashoffset: 0; } 46% { stroke-dashoffset: 16; } }
